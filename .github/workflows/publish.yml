name: publish runtimes

# One image per runtime, tagged <runtime>-<line> (node-22, python-3.14, ...).
#
# The line is fixed by the agent's contract tags, but the image is rebuilt on a
# weekly schedule so the base image (node:22-bookworm-slim, python:3.14-slim,
# ...) floats to the latest patch release within the line. Moving the tag is
# deliberate: a node that pulls node-22 picks up security patches on its next
# pull instead of requiring a commit per release.
#
# Manual dispatch and tag pushes still rebuild everything. Deno has no floating
# major tag, so its version is resolved against the registry at build time.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    tags:
      - "v*"

concurrency:
  group: publish-runtimes
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: nellyxcloud
  IMAGE_PREFIX: runtimes

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, python, deno, go, php, static]

    steps:
      - uses: actions/checkout@v4

      # The tag is derived from the Dockerfile's TAG_VERSION arg, so bumping
      # a line in one place is enough.
      - name: Resolve tag
        id: meta
        env:
          RUNTIME_DIR: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          arg=$(grep -Eo '^ARG TAG_VERSION=[0-9.]+' "$RUNTIME_DIR/Dockerfile" | head -1 | cut -d= -f2)
          if [ -z "$arg" ]; then
            echo "no TAG_VERSION arg in $RUNTIME_DIR/Dockerfile" >&2
            exit 1
          fi
          echo "version=${arg}" >> "$GITHUB_OUTPUT"

      # Deno has no floating 2.x tag, so resolve the latest 2.x release from
      # the registry at build time instead of pinning a patch in the repo.
      - name: Resolve Deno version
        id: deno
        if: matrix.runtime == 'deno'
        run: |
          set -euo pipefail
          ver=$(curl -fsSL "https://hub.docker.com/v2/repositories/denoland/deno/tags?page_size=100" | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$ver" ]; then
            echo "failed to resolve a Deno version" >&2
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved Deno ${ver}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the repository root: the Dockerfiles COPY shared/entrypoint.sh.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.runtime }}/Dockerfile
          push: true
          build-args: ${{ matrix.runtime == 'deno' && format('DENO_VERSION={0}', steps.deno.outputs.version) || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}:${{ matrix.runtime }}-${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.runtime }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.serverUrl }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runtime }}

      # A published image that cannot run a service is worse than a failed build:
      # nodes would pull it and every service on that runtime would exit.
      - name: Smoke test
        run: ./scripts/smoke.sh ${{ matrix.runtime }} ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}:${{ matrix.runtime }}-${{ steps.meta.outputs.version }}