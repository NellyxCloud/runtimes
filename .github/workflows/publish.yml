name: publish runtimes

# One image per runtime, tagged <runtime>-<version>.
#
# Triggered by hand and on tag pushes. A rebuild of the same tag is deliberately
# not automatic: a node that pulls `node-22` should get the same bits on every
# host, so changing an image means publishing `node-22.1` and keeping `node-22`
# pointed at the last known-good build.

on:
  workflow_dispatch:
    inputs:
      runtimes:
        description: "Comma separated runtimes to build (blank = all)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  OWNER: NellyxCloud
  IMAGE_PREFIX: runtimes

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, python, deno, go, php, static]

    steps:
      - uses: actions/checkout@v4

      # The tag is derived from the Dockerfile's own ARG default rather than
      # duplicated here, so bumping a version in one place is enough.
      - name: Resolve tag
        id: meta
        env:
          RUNTIME_DIR: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          arg=$(grep -Eo '^ARG [A-Z_]*VERSION=[0-9.]+' "$RUNTIME_DIR/Dockerfile" | head -1 | cut -d= -f2)
          if [ -z "$arg" ]; then
            echo "no VERSION arg in $RUNTIME_DIR/Dockerfile" >&2
            exit 1
          fi
          echo "version=${arg}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the repository root: the Dockerfiles COPY shared/entrypoint.sh.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.runtime }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}:${{ matrix.runtime }}-${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.runtime }}
            org.opencontainers.image.source=${{ github.serverUrl }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runtime }}

      # A published image that cannot run a service is worse than a failed build:
      # nodes would pull it and every service on that runtime would exit.
      - name: Smoke test
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}:${{ matrix.runtime }}-${{ steps.meta.outputs.version }}"
          case "${{ matrix.runtime }}" in
            static) start="true" ;;
            *)      start="node -e 'require(\"http\").createServer((q,s)=>s.end(\"ok\")).listen(process.env.PORT||3000)' 2>/dev/null || python3 -c 'import os,http.server;s=http.server.HTTPServer((\"0.0.0.0\",int(os.environ.get(\"PORT\",3000))),http.server.BaseHTTPRequestHandler);s.serve_forever()'" ;;
          esac
          docker run -d --name smoke -e START_COMMAND="$start" -e PORT=3000 -p 127.0.0.1:3000:3000 "$image"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then
              echo "${{ matrix.runtime }} responds"
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "${{ matrix.runtime }} did not answer; container log:" >&2
          docker logs smoke >&2
          docker rm -f smoke
          exit 1