server {
	listen 8080;
	server_name _;

	root /home/nellyx/app;

	# A static site is a directory of files; nothing here executes, which is
	# what the contract's rules.noExecution promises.
	index index.html index.htm;

	access_log /var/log/nellyx/access.log;
	error_log  /var/log/nellyx/error.log warn;

	location / {
		try_files $uri $uri/ /index.html =404;
	}

	# Long-lived immutable assets, short cache for the entry document.
	location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
	}

	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# No directory listing: the workspace is browsable over SFTP by whoever the
	# panel authorises, and not through the public endpoint.
	autoindex off;

	client_max_body_size 32m;
}